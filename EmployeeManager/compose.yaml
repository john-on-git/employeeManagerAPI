# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: myUsername
      POSTGRES_PASSWORD: myPassword
      POSTGRES_DB: employeeManagerDB
    ports:
      - "0.0.0.0:5432:5432"
      
  employeemanager:
    build: .
    restart: always
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      - db